{
  "table": { "schema": "public", "name": "watched_orders" },
  "object_relationships":
    [
      {
        "name": "organization",
        "using": { "foreign_key_constraint_on": "org_id" },
      },
    ],
  "select_permissions":
    [
      {
        "role": "user",
        "permission":
          {
            "columns": ["id", "org_id", "external_ref", "amount", "created_at"],
            "filter":
              {
                "organization":
                  { "members": { "user_id": { "_eq": "X-Hasura-User-Id" } } },
              },
          },
      },
    ],
  "insert_permissions":
    [
      {
        "role": "user",
        "permission":
          {
            "columns": ["org_id", "external_ref", "amount"],
            "check":
              {
                "organization":
                  { "members": { "user_id": { "_eq": "X-Hasura-User-Id" } } },
              },
          },
      },
    ],
  "event_triggers":
    [
      {
        "name": "watched-orders-workflow",
        "definition":
          {
            "enable_manual": false,
            "insert": { "columns": "*" },
            "update": { "columns": "*" },
          },
        "webhook": "{{NHOST_FUNCTIONS_URL}}/databaseEventStart",
        "headers":
          [
            {
              "name": "x-relay-action-secret",
              "value_from_env": "RELAY_ACTION_SECRET",
            },
          ],
        "retry_conf":
          { "num_retries": 3, "interval_sec": 10, "timeout_sec": 60 },
      },
    ],
}
