{
  "table": { "schema": "public", "name": "workflow_results" },
  "object_relationships":
    [
      {
        "name": "organization",
        "using": { "foreign_key_constraint_on": "org_id" },
      },
      {
        "name": "workflow_run",
        "using": { "foreign_key_constraint_on": "run_id" },
      },
    ],
  "select_permissions":
    [
      {
        "role": "user",
        "permission":
          {
            "columns": ["id", "org_id", "run_id", "value", "created_at"],
            "filter":
              {
                "organization":
                  { "members": { "user_id": { "_eq": "X-Hasura-User-Id" } } },
              },
          },
      },
    ],
}
