{
  "table": { "schema": "public", "name": "notification_deliveries" },
  "object_relationships":
    [
      {
        "name": "organization",
        "using": { "foreign_key_constraint_on": "org_id" },
      },
      {
        "name": "workflow_run",
        "using": { "foreign_key_constraint_on": "run_id" },
      },
    ],
  "select_permissions":
    [
      {
        "role": "user",
        "permission":
          {
            "columns":
              [
                "id",
                "org_id",
                "run_id",
                "destination",
                "payload",
                "status",
                "error",
                "attempts",
                "created_at",
                "delivered_at",
              ],
            "filter":
              {
                "organization":
                  { "members": { "user_id": { "_eq": "X-Hasura-User-Id" } } },
              },
          },
      },
    ],
  "event_triggers":
    [
      {
        "name": "deliver-notification",
        "definition": { "enable_manual": false, "insert": { "columns": "*" } },
        "webhook": "{{NHOST_FUNCTIONS_URL}}/deliverNotification",
        "headers":
          [
            {
              "name": "x-relay-action-secret",
              "value_from_env": "RELAY_ACTION_SECRET",
            },
          ],
        "retry_conf":
          { "num_retries": 3, "interval_sec": 10, "timeout_sec": 60 },
      },
    ],
}
