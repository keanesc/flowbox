{
  "table": {
    "schema": "public",
    "name": "workflow_steps"
  },
  "object_relationships": [
    {
      "name": "workflow",
      "using": {
        "foreign_key_constraint_on": "workflow_id"
      }
    }
  ],
  "select_permissions": [
    {
      "role": "user",
      "permission": {
        "columns": [
          "id",
          "workflow_id",
          "position",
          "type",
          "config",
          "created_at",
          "updated_at"
        ],
        "filter": {
          "workflow": {
            "organization": {
              "members": {
                "user_id": {
                  "_eq": "X-Hasura-User-Id"
                }
              }
            }
          }
        }
      }
    }
  ]
}
