{
  "table": {
    "schema": "public",
    "name": "organization_monthly_usage"
  },
  "select_permissions": [
    {
      "role": "user",
      "permission": {
        "columns": [
          "org_id",
          "name",
          "used",
          "limit",
          "remaining",
          "period_started_at",
          "period_ends_at"
        ],
        "filter": {
          "_exists": {
            "_table": {
              "schema": "public",
              "name": "org_members"
            },
            "_where": {
              "org_id": {
                "_ceq": [
                  "$",
                  "org_id"
                ]
              },
              "user_id": {
                "_eq": "X-Hasura-User-Id"
              }
            }
          }
        }
      }
    }
  ]
}
